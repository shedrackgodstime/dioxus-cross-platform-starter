[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
version = "0.1.0"
authors = ["UTME Lab"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Dioxus 0.7 ecosystem. Default features stay off; every crate opts into
# exactly the renderers it needs so bundles do not pull in unused backends.
dioxus = { version = "0.7.10", default-features = false }

# Data & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Browser HTTP client, used by the standalone web SPA which has no
# `dioxus/fullstack` (that would make the CLI treat it as a fullstack server).
gloo-net = { version = "0.6", features = ["http", "json"] }

axum = { version = "0.8", features = ["json"] }

# Native HTTP client for the desktop and mobile clients. Matches the feature set
# Dioxus itself uses, so the graph resolves without new crates.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# CORS for the API-only server. The standalone web client is served from a
# different dev port than the API, so its cross-origin reads need this;
# production serves the SPA same-origin and never relies on it.
tower-http = { version = "0.6", features = ["cors"] }

# Internal workspace crates
core = { path = "crates/core" }
api = { path = "crates/api" }
ui = { path = "crates/ui" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
