[workspace]
members = [
    "crates/core",
    "crates/api",
    "crates/server",
    "crates/ui",
    "crates/web",
    "crates/web-client",
    "crates/desktop",
    "crates/mobile",
]
default-members = ["crates/web"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Dioxus Cross-Platform Team"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"

[workspace.dependencies]
# Dioxus 0.7 ecosystem
dioxus = { version = "0.7.10" }

# Data & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# HTTP & Cryptography
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
dotenvy = "0.15"

# Async & Runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
log = "0.4"
android_logger = "0.15"

# Web Platform
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Document",
    "Element",
    "Navigator",
] }

# Desktop Platform
directories = "6"

# Mobile (Android JNI)
jni = "0.22"
ndk-context = "0.1"

# Internal Workspace Crates
starter-core = { path = "crates/core" }
starter-api = { path = "crates/api" }
starter-server = { path = "crates/server" }
starter-ui = { path = "crates/ui" }
