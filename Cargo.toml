[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
version = "0.1.0"
authors = ["UTME Lab"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Dioxus 0.7 ecosystem. Default features stay off; every crate opts into
# exactly the renderers it needs so bundles do not pull in unused backends.
dioxus = { version = "0.7.10", default-features = false }

# Data & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal workspace crates
core = { path = "crates/core" }
api = { path = "crates/api" }
ui = { path = "crates/ui" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
