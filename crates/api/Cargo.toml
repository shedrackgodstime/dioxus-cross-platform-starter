[package]
name = "api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = []
fullstack = ["dep:dioxus"]
server = ["fullstack", "dioxus/server"]
# Plain-HTTP client adapter for browser SPAs. Deliberately excludes
# `dioxus/fullstack`: enabling that makes the Dioxus CLI treat a package as a
# fullstack server and run its native binary.
http-client = ["dep:gloo-net"]
# Plain-HTTP adapter for native clients. Deliberately excludes
# `dioxus/fullstack`, which would make the Dioxus CLI run a local server for the
# client instead of leaving it a pure consumer of the API.
native-client = ["dep:reqwest"]

[dependencies]
dioxus = { workspace = true, features = ["lib", "fullstack"], optional = true }
gloo-net = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
core = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
