[package]
name = "fullstack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "api/server"]

[dependencies]
# The server-function transport is always available here; this crate always
# enables `dioxus/fullstack`. Only `server` mode adds the server-side halves.
api = { workspace = true, features = ["fullstack"] }
# `launch` backs the client-side entrypoint; `fullstack` backs dioxus::serve.
dioxus = { workspace = true, features = ["launch", "lib", "fullstack"] }
ui = { workspace = true }

[lints]
workspace = true
