[package]
name = "fullstack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = []
web = ["dioxus/web", "dep:api", "api/fullstack", "ui/fullstack"]
server = ["dioxus/server", "dep:api", "api/server", "ui/fullstack"]

[dependencies]
api = { workspace = true, optional = true }
# `launch` backs the client-side entrypoint; `fullstack` backs dioxus::serve.
dioxus = { workspace = true, features = ["launch", "lib", "fullstack"] }
ui = { workspace = true }

[lints]
workspace = true
