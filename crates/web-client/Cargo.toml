[package]
name = "starter-web-client"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "starter-web-client"
path = "src/main.rs"

[dependencies]
starter-web = { path = "../web" }

[features]
default = []
# Dioxus CLI enables the selected renderer feature on the package it builds.
# Propagate that feature to the launcher dependency so its `launch_client`
# path is compiled with the actual Dioxus web renderer.
web = ["starter-web/web", "starter-web/standalone"]
