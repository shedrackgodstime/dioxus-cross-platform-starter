<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark" />
    <title>Dioxus Cross-Platform Starter</title>
    <style>
      /* Base & Reset */
      html, body {
        background-color: #020617 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #main {
        min-height: 100vh;
        width: 100%;
        background-color: #020617;
      }

      /* Splash Screen: Fixed full-viewport overlay */
      #splash-screen {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 50% 40%, #0f172a 0%, #020617 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s;
        user-select: none;
        -webkit-user-select: none;
      }

      #splash-screen.splash-hidden {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }

      .splash-logo-box {
        position: relative;
        width: 88px;
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }

      .splash-glow {
        position: absolute;
        inset: -12px;
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.4), rgba(139, 92, 246, 0.4));
        border-radius: 28px;
        filter: blur(16px);
        animation: splash-pulse 2.4s ease-in-out infinite alternate;
      }

      .splash-svg {
        position: relative;
        width: 80px;
        height: 80px;
        filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
        animation: splash-breathe 3s ease-in-out infinite;
      }

      .splash-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f8fafc;
        margin: 0 0 6px 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .splash-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 9999px;
        background: rgba(59, 130, 246, 0.15);
        color: #60a5fa;
        border: 1px solid rgba(59, 130, 246, 0.3);
      }

      .splash-subtitle {
        font-size: 13px;
        font-weight: 400;
        color: #94a3b8;
        margin: 0 0 32px 0;
      }

      .splash-bar-container {
        width: 160px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }

      .splash-bar-fill {
        position: absolute;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #3b82f6, #a855f7);
        border-radius: 9999px;
        animation: splash-slide 1.4s ease-in-out infinite;
      }

      @keyframes splash-pulse {
        0% { transform: scale(0.92); opacity: 0.35; }
        100% { transform: scale(1.08); opacity: 0.7; }
      }

      @keyframes splash-breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      @keyframes splash-slide {
        0% { left: -45%; }
        100% { left: 100%; }
      }
    </style>
    <script>
      // Global splash controller callable from Rust (Dioxus document::eval) or JS
      window.__dismissSplash = function() {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const el = document.getElementById("splash-screen");
            if (el) {
              el.classList.add("splash-hidden");
            }
          });
        });
      };

      window.__showSplashScreen = function(durationMs = 1500) {
        const el = document.getElementById("splash-screen");
        if (el) {
          el.classList.remove("splash-hidden");
          if (durationMs > 0) {
            setTimeout(() => {
              window.__dismissSplash();
            }, durationMs);
          }
        }
      };

      // Safety fallback: auto-dismiss after 3.5 seconds if runtime is blocked
      setTimeout(() => {
        window.__dismissSplash();
      }, 3500);
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="splash-screen">
      <div class="splash-logo-box">
        <div class="splash-glow"></div>
        <svg class="splash-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="splash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3b82f6" />
              <stop offset="100%" stop-color="#8b5cf6" />
            </linearGradient>
          </defs>
          <rect width="100" height="100" rx="24" fill="url(#splash-grad)" />
          <path d="M50 20L75 35V65L50 80L25 65V35L50 20Z" stroke="white" stroke-width="6" stroke-linejoin="round" />
          <path d="M50 40L65 49V67L50 76L35 67V49L50 40Z" fill="white" fill-opacity="0.3" />
          <circle cx="50" cy="50" r="10" fill="white" />
        </svg>
      </div>
      <div class="splash-title">
        <span>Dioxus Starter</span>
        <span class="splash-badge">v2.0</span>
      </div>
      <p class="splash-subtitle">Universal Dioxus Starter</p>
      <div class="splash-bar-container">
        <div class="splash-bar-fill"></div>
      </div>
    </div>
    <div id="main"></div>
  </body>
</html>
