name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev lld librsvg2-dev wget

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Run project quality gates
        run: make ci-quality

  web:
    name: Web builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Install prebuilt Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force

      - name: Build full-stack web app
        run: make build-web-server-debug

      - name: Build standalone web app
        run: make build-web-debug

  desktop-linux:
    name: Linux desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dioxus desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev lld librsvg2-dev wget

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main

      - name: Install prebuilt Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force

      - name: Build Linux desktop app
        run: make build-desktop-debug

  android:
    name: Android ARM64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install prebuilt Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force

      - name: Build Android debug APK through Make
        run: make build-android-debug

  ios:
    name: iOS ARM64 compile check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Install prebuilt Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force

      - name: Build iOS app
        run: make build-ios-debug

  windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Install prebuilt Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force

      - name: Build Windows desktop app
        run: make build-desktop-debug
