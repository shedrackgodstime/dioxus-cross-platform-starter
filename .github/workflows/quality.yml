name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Linux, web, and desktop quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dioxus desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            lld \
            librsvg2-dev \
            wget

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Check formatting
        run: make fmt-check

      - name: Check crate boundaries
        run: make check-boundaries

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Check full-stack server feature
        run: cargo check --package starter-web --features server --locked

      - name: Check browser target
        run: cargo check --package starter-web --target wasm32-unknown-unknown --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run full-stack server Clippy
        run: cargo clippy --package starter-web --features server --locked -- -D warnings

      - name: Build full-stack web app with Dioxus CLI
        run: make build-web-server-debug

      - name: Build standalone web app with Dioxus CLI
        run: make build-web-debug

      - name: Build desktop app with Dioxus CLI
        run: make build-desktop-debug

  android:
    name: Android ARM64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.3.13750724

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Build Android debug APK through the Makefile
        run: make build-android-debug

  ios:
    name: iOS ARM64 compile check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: Check iOS device target
        run: cargo check --package starter-mobile --target aarch64-apple-ios --locked

      - name: Check iOS simulator target
        run: cargo check --package starter-mobile --target aarch64-apple-ios-sim --locked

  windows:
    name: Windows desktop compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@v2

      - name: Check desktop launcher
        run: cargo check --package starter-desktop --locked
