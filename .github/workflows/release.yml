name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      server_url:
        description: Full-stack API URL to bake into native release clients
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROD_SERVER_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.server_url || vars.PROD_SERVER_URL }}

jobs:
  validate:
    name: Validate release configuration
    runs-on: ubuntu-latest
    steps:
      - name: Require a production server URL for native apps
        run: |
          if [ -z "$PROD_SERVER_URL" ]; then
            echo "Set the PROD_SERVER_URL repository variable or provide server_url when manually dispatching this workflow." >&2
            exit 1
          fi
          case "$PROD_SERVER_URL" in
            https://*) ;;
            *) echo "PROD_SERVER_URL must use HTTPS for a release build." >&2; exit 1 ;;
          esac

  fullstack-web:
    name: Full-stack web server (Linux x86_64)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Install prebuilt Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force

      - name: Build full-stack web release
        run: make build-web-server

      - name: Archive web server and client assets
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/dioxus-starter-fullstack-web-linux-x86_64-${GITHUB_REF_NAME}.tar.gz" \
            -C target/dx/starter-web/release/web .

      - uses: actions/upload-artifact@v4
        with:
          name: fullstack-web-linux-x86_64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  web:
    name: Standalone web client (Linux build)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main

      - name: Install prebuilt Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force

      - name: Build standalone web release
        env:
          PROD_SERVER_URL: ${{ env.PROD_SERVER_URL }}
        run: make build-web

      - name: Archive standalone web client
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/dioxus-starter-web-client-${GITHUB_REF_NAME}.tar.gz" \
            -C target/dx/starter-web-client/release/web/public .

      - uses: actions/upload-artifact@v4
        with:
          name: web-client
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            label: Linux x86_64
          - os: macos-latest
            platform: desktop
            label: macOS
          - os: windows-latest
            platform: desktop
            label: Windows x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            lld \
            librsvg2-dev \
            wget

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Install prebuilt Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force

      - name: Build desktop release
        env:
          PROD_SERVER_URL: ${{ env.PROD_SERVER_URL }}
        run: make build-desktop

      - name: Archive Linux desktop app
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/dioxus-starter-desktop-${{ matrix.label }}-${GITHUB_REF_NAME}.tar.gz" \
            -C target/dx/starter-desktop/release/linux app

      - name: Archive macOS desktop app
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            target/dx/starter-desktop/release/macos/app \
            "release-assets/dioxus-starter-desktop-${{ matrix.label }}-${GITHUB_REF_NAME}.zip"

      - name: Archive Windows desktop app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path target/dx/starter-desktop/release/windows/app -DestinationPath "release-assets/dioxus-starter-desktop-${{ matrix.label }}-$env:GITHUB_REF_NAME.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android ARM64 release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install prebuilt Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force

      - name: Build Android release APK
        run: make build-android

      - name: Stage unsigned Android APK
        run: |
          mkdir -p release-assets
          apk_path="$(find target/dx/starter-mobile/release/android/app -type f -name '*.apk' -print -quit)"
          if [ -z "$apk_path" ]; then
            echo "Dioxus did not produce an Android APK." >&2
            exit 1
          fi
          cp "$apk_path" "release-assets/dioxus-starter-android-arm64-${GITHUB_REF_NAME}-unsigned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS device app (unsigned)
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Install prebuilt Dioxus CLI
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force

      - name: Build unsigned iOS app bundle
        env:
          PROD_SERVER_URL: ${{ env.PROD_SERVER_URL }}
        run: make build-ios

      - name: Archive unsigned iOS app
        run: |
          mkdir -p release-assets
          app_path="$(find target/dx/starter-mobile/release/ios -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "Dioxus did not produce an iOS app bundle." >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            "release-assets/dioxus-starter-ios-arm64-${GITHUB_REF_NAME}-unsigned.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-unsigned
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fullstack-web, web, desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
